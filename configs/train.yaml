# Copy this file for each experiment and change one value at a time.
run_name: resnet18_baseline
seed: 42
backbone: resnet18        # resnet18 | resnet50
pretrained: true
freeze_backbone: true     # true = train only the final layer
image_size: 224
batch_size: 32
epochs: 15
optimizer: adam           # adam | sgd
lr: 0.001
weight_decay: 0.0001
augment: true
